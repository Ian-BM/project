{% extends "base.html" %}
{% block title %}New Assessment{% endblock %}
{% block page_header %}<div class="page-header"><div class="page-header-text"><h1>Create Assessment</h1></div></div>{% endblock %}
{% block content %}
<div class="card" style="max-width:720px;"><div class="card-body">
<form method="post">{% csrf_token %}
{% for field in form %}<div class="form-group"><label class="form-label">{{ field.label }}</label>{{ field }}{% if field.errors %}<div class="form-error">{{ field.errors.0 }}</div>{% endif %}</div>{% endfor %}
<div class="btn-group"><button class="btn btn-primary" type="submit">Save</button><a href="{% url 'assessment_list' %}" class="btn btn-secondary">Cancel</a></div>
</form></div></div>
{% endblock %}
