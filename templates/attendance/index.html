<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Attendance</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 24px;
            background: #f3f4f6;
            color: #111827;
        }
        .container {
            max-width: 720px;
            margin: 0 auto;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 20px;
        }
        h1 {
            margin-top: 0;
            font-size: 24px;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 4 / 3;
            margin: 0 auto;
            border-radius: 10px;
            overflow: hidden;
        }
        video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 10px;
        }
        #overlayCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 10;
            pointer-events: none;
        }
        button {
            margin-top: 16px;
            background: #2563eb;
            color: #fff;
            border: none;
            border-radius: 8px;
            padding: 12px 18px;
            font-size: 16px;
            cursor: pointer;
        }
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        #status {
            margin-top: 16px;
            font-weight: bold;
        }
        #students {
            margin-top: 12px;
            padding-left: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <div>
            <h1>Face Attendance</h1>
        </div>
        <div>
            <a href="/dashboard/" style="margin-right:16px; color:#2563eb; text-decoration:none;">Dashboard</a>
            <a href="{% url 'logout' %}" style="color:#ef4444; text-decoration:none;">Logout</a>
        </div>
    </div>
    <div class="video-container">
        <video id="video" autoplay playsinline></video>
        <canvas id="overlayCanvas" class="overlay-canvas"></canvas>
    </div>
    <canvas id="canvas" style="display:none;"></canvas>
    <button id="startSessionBtn">Start Session</button>
    <button id="endSessionBtn" disabled>End Session</button>
    <button id="captureBtn">Capture Attendance</button>
    <p id="status">Starting camera...</p>
    <p id="sessionStatus">Session: Stopped</p>
    <ul id="students"></ul>
</div>

<script>
    const video = document.getElementById("video");
    const canvas = document.getElementById("canvas");
    const overlayCanvas = document.getElementById("overlayCanvas");
    const startSessionBtn = document.getElementById("startSessionBtn");
    const endSessionBtn = document.getElementById("endSessionBtn");
    const captureBtn = document.getElementById("captureBtn");
    const statusEl = document.getElementById("status");
    const sessionStatusEl = document.getElementById("sessionStatus");
    const studentsEl = document.getElementById("students");
    let sessionActive = false;
    let captureIntervalId = null;
    let modelsLoaded = false;
    let displaySize = null;

    async function loadModels() {
        try {
            statusEl.textContent = "Loading face detection models...";
            await faceapi.nets.tinyFaceDetector.loadFromUri('/static/models/');
            modelsLoaded = true;
            statusEl.textContent = "Face detection ready.";
            if (video.videoWidth && video.videoHeight) {
                detectFaces();
            }
        } catch (error) {
            statusEl.textContent = "Failed to load face detection models. Please check /static/models/.";
            console.error("Model loading error:", error);
        }
    }

    async function startCamera() {
        try {
            const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
            video.srcObject = stream;
            video.addEventListener('play', () => {
                overlayCanvas.width = video.videoWidth;
                overlayCanvas.height = video.videoHeight;
                displaySize = { width: video.videoWidth, height: video.videoHeight };
                faceapi.matchDimensions(overlayCanvas, displaySize);
                if (modelsLoaded) {
                    detectFaces();
                }
            });
            statusEl.textContent = "Camera ready. Loading face detector...";
        } catch (error) {
            statusEl.textContent = "Unable to access webcam.";
            captureBtn.disabled = true;
        }
    }

    async function detectFaces() {
        if (!modelsLoaded || !video.videoWidth || !video.videoHeight || !displaySize) {
            requestAnimationFrame(detectFaces);
            return;
        }

        try {
            const options = new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.5 });
            const detections = await faceapi.detectAllFaces(video, options);
            const resizedDetections = faceapi.resizeResults(detections, displaySize);
            const ctx = overlayCanvas.getContext('2d');
            ctx.clearRect(0, 0, overlayCanvas.width, overlayCanvas.height);
            faceapi.draw.drawDetections(overlayCanvas, resizedDetections);
        } catch (error) {
            console.error("Detection error:", error);
        }

        requestAnimationFrame(detectFaces);
    }

    async function captureAttendance() {
        if (!video.videoWidth || !video.videoHeight) {
            statusEl.textContent = "Camera not ready yet.";
            return;
        }

        captureBtn.disabled = true;
        statusEl.textContent = "Capturing image...";
        studentsEl.innerHTML = "";

        const maxWidth = 640;
        const scale = Math.min(1, maxWidth / video.videoWidth);
        canvas.width = Math.floor(video.videoWidth * scale);
        canvas.height = Math.floor(video.videoHeight * scale);
        const ctx = canvas.getContext("2d");
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const image = canvas.toDataURL("image/jpeg", 0.6);

        try {
            statusEl.textContent = "Recognizing faces...";
            const response = await fetch("/recognize/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ image })
            });

            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "Request failed.");
            }

            const students = data.students || [];
            if (students.length === 0) {
                statusEl.textContent = sessionActive ? "No known student detected in this frame." : "No active session.";
            } else {
                statusEl.textContent = "Detections captured.";
                students.forEach((name) => {
                    const li = document.createElement("li");
                    li.textContent = name;
                    studentsEl.appendChild(li);
                });
            }
        } catch (error) {
            statusEl.textContent = `Error: ${error.message}`;
        } finally {
            captureBtn.disabled = false;
        }
    }

    async function startSession() {
        try {
            const response = await fetch("/start-session/", { method: "POST" });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "Unable to start session.");
            }

            sessionActive = true;
            sessionStatusEl.textContent = `Session: Active (#${data.session_id})`;
            statusEl.textContent = data.message ? data.message : "Session started.";
            startSessionBtn.disabled = true;
            endSessionBtn.disabled = false;

            if (captureIntervalId) {
                clearInterval(captureIntervalId);
            }
            captureIntervalId = setInterval(captureAttendance, 5000);
            captureAttendance();
        } catch (error) {
            statusEl.textContent = `Error: ${error.message}`;
        }
    }

    async function endSession() {
        try {
            const response = await fetch("/end-session/", { method: "POST" });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "Unable to end session.");
            }

            sessionActive = false;
            sessionStatusEl.textContent = "Session: Stopped";
            statusEl.textContent = "Session ended. Attendance summary computed.";
            startSessionBtn.disabled = false;
            endSessionBtn.disabled = true;
            if (captureIntervalId) {
                clearInterval(captureIntervalId);
                captureIntervalId = null;
            }
        } catch (error) {
            statusEl.textContent = `Error: ${error.message}`;
        }
    }

    captureBtn.addEventListener("click", captureAttendance);
    startSessionBtn.addEventListener("click", startSession);
    endSessionBtn.addEventListener("click", endSession);
    startCamera();
    loadModels();
</script>
</body>
</html>
